# Neutral-only variant of config/new_game_theory_decision_config.yaml.
# Keeps the same model and benchmark coverage, but disables emotion steering.
experiment_name: "game_theory_decision_neutral"
description: "neutral-only game theory decision config for new benchmark infra"
version: "1.0.0"

models:
  - "${USER_HOME}/huggingface_models/Qwen/Qwen3-0.6B"
  - "${USER_HOME}/huggingface_models/Qwen/Qwen3-1.7B"
  - "${USER_HOME}/huggingface_models/Qwen/Qwen3-4B"
  - "${USER_HOME}/huggingface_models/Qwen/Qwen2.5-0.5B-Instruct"
  - "${USER_HOME}/huggingface_models/Qwen/Qwen2.5-1.5B-Instruct"
  - "${USER_HOME}/huggingface_models/Qwen/Qwen2.5-3B-Instruct"
  - "${USER_HOME}/huggingface_models/google/gemma-3-270m-it"
  - "${USER_HOME}/huggingface_models/google/gemma-3-1b-it"
  - "${USER_HOME}/huggingface_models/google/gemma-3-4b-it"
  - "${USER_HOME}/huggingface_models/microsoft/Phi-3.5-mini-instruct/"
  - "${USER_HOME}/huggingface_models/microsoft/Phi-4-mini-instruct/"
  - "${USER_HOME}/huggingface_models/meta-llama/Llama-3.2-1B-Instruct"
  - "${USER_HOME}/huggingface_models/meta-llama/Llama-3.2-3B-Instruct"
  - "${USER_HOME}/huggingface_models/microsoft/Phi-4-multimodal-instruct"
  - "${USER_HOME}/huggingface_models/microsoft/Phi-3.5-vision-instruct"
  - "${USER_HOME}/huggingface_models/Qwen/Qwen3-VL-2B-Instruct"
  - "${USER_HOME}/huggingface_models/Qwen/Qwen3-VL-4B-Instruct"
  - "${USER_HOME}/huggingface_models/OpenGVLab/InternVL3-1B"
  - "${USER_HOME}/huggingface_models/OpenGVLab/InternVL3-2B"
  - "${USER_HOME}/huggingface_models/Zyphra/Zamba2-1.2B-Instruct"
  - "${USER_HOME}/huggingface_models/Zyphra/Zamba2-2.7B-Instruct"

emotions: []
intensities: [0.0]

benchmarks:
  - name: "game_theory_decision"
    task_type: "Beauty_Contest"
    data_path: "data_creation/scenario_creation/langgraph_creation/Diplomacy/beauty_contest/beauty_contest.success.json"
    augmentation_config:
      shuffle_options: true
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0

loading_config:
  gpu_memory_utilization: 0.79
  enforce_eager: true
  quantization: null
  max_model_len: 8192
  trust_remote_code: true
  dtype: "bfloat16"
  seed: 1
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

repeat_runs: 5

generation_config:
  temperature: 0.7
  max_new_tokens: 500
  do_sample: true
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 800

output_dir: "results/new_game_theory_decision/neutral_baseline_diplomacy_BC"
sanity_check: false
defer_evaluation: false
