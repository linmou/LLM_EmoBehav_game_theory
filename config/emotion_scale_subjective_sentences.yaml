# Emotion Scale Configuration
# Purpose: test whether steering vectors shift emotional tone on subjective prompts.

experiment_name: "emotion_scale_subjective_sentences"
description: "Emotion steering validation on subjective sentence prompts with Gemini 7-class judging"
version: "1.0.0"

models:
  - "Qwen/Qwen2.5-3B-Instruct"

benchmarks:
  - name: "emotion_check"
    task_type: "emotion_scale"
    data_path: "data/emotion_scales/emotion_check_emotion_scale_subjective_sentences.jsonl"
    base_data_dir: "data/emotion_scales"
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash"
      temperature: 0.0
      evaluation_prompt: |
        You are a strict emotion classifier.
        Classify the assistant response into exactly one label from:
        anger, happiness, sadness, fear, disgust, surprise, neutral
        
        Input sentence: {question}
        Assistant response: {response}
        
        Rules:
        - Pick neutral when no clear emotional expression exists.
        - Do not output labels outside the 7 allowed labels.
        - Return JSON only in this format:
        {{"emotion": "one_label", "confidence": 0.0}}

emotions: ["anger", "happiness", "sadness", "fear", "disgust", "surprise"]
intensities: [1.5, 2.5]

loading_config:
  model_path: null
  gpu_memory_utilization: 0.70
  tensor_parallel_size: 2
  max_model_len: 4096
  enforce_eager: true
  quantization: null
  trust_remote_code: true
  dtype: "float16"
  seed: 42
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

repe_eng_config:
  direction_method: "pca"
  data_dir: "data/stimulus/crowd-enVent_textlike"

generation_config:
  temperature: 0.7
  max_new_tokens: 96
  do_sample: true
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 24
max_evaluation_workers: 4
pipeline_queue_size: 2

output_dir: "results/emotion_scale_subjective_sentences/crowd-enVent_textlike"
run_sanity_check: false
