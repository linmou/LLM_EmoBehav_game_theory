experiment_name: "game_theory_base_model_completion_option_id"
description: "Base-model completion prompt that emits option id "
version: "1.0.0"

models:
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen2.5-0.5B"
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen2.5-1.5B"
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen2.5-3B"
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen3-0.6B-Base"
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen3-1.7B-Base"
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen3-4B-Base"
  - "/data/home/jjl7137/huggingface_models/meta-llama/Llama-3.2-1B"
  - "/data/home/jjl7137/huggingface_models/meta-llama/Llama-3.2-3B"
  - "/data/home/jjl7137/huggingface_models/google/gemma-3-1b-pt"
  - "/data/home/jjl7137/huggingface_models/google/gemma-3-4b-pt"
    #- "/data/home/jjl7137/huggingface_models/mistralai/Ministral-3-3B-Base-2512"

emotions: ["anger", "sadness", "happiness", "surprise", "fear", "disgust"]
intensities: [1.0, 1.5]

benchmarks:
  - name: "game_theory_completion_option_id"
    task_type: "Prisoners_Dilemma"
    augmentation_config:
      shuffle_options: true
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 800
  - name: "game_theory_completion_option_id"
    task_type: "Stag_Hunt"
    augmentation_config:
      shuffle_options: true
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 800
  - name: "game_theory_completion_option_id"
    task_type: "Escalation_Game"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 800
  - name: "game_theory_completion_option_id"
    task_type: "Trust_Game_Trustor"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 800
  - name: "game_theory_completion_option_id"
    task_type: "Trust_Game_Trustee"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 1
      previous_trust_level: 1
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 800
  - name: "game_theory_completion_option_id"
    task_type: "Ultimatum_Game_Proposer"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
      previous_offer_level: 1
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 800
  - name: "game_theory_completion_option_id"
    task_type: "Ultimatum_Game_Responder"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 1
      previous_offer_level: 2
    enable_auto_truncation: false
    truncation_strategy: "right"
    preserve_ratio: 1.0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 800

loading_config:
  gpu_memory_utilization: 0.70
  enforce_eager: true
  quantization: null
  max_model_len: 8192
  trust_remote_code: true
  dtype: "bfloat16"
  seed: 1
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

repe_eng_config:
  data_dir: "data/stimulus/crowd-enVent_textlike"

generation_config:
  temperature: 0.0
  max_new_tokens: 5
  do_sample: false
  repetition_penalty: 1.0
  enable_thinking: false

batch_size: 800
output_dir: "results/game_theory_base_model/shuffle_800"
sanity_check: false
defer_evaluation: true
