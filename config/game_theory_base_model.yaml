experiment_name: "game_theory_base_model_completion_option_id"
description: "Base-model completion prompt that emits option id (dry-run validation)"
version: "1.0.0"

models:
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen2.5-0.6B"
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen2.5-1.5B"
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen2.5-3B"


# Keep minimal for dry-run speed; neutral baseline is added automatically during real runs.
emotions: ["anger", "sadness", "happiness", "surprise", "fear", "disgust"]
intensities: [1.0, 1.5]

benchmarks:
  - name: "game_theory_completion_option_id"
    task_type: "Escalation_Game"
    data_path: "data_creation/scenario_creation/langgraph_creation/diplomacy_Escalation_Game_all_data_samples.json"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
    sample_limit: 500
    llm_eval_config: 
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0

loading_config:
  gpu_memory_utilization: 0.80
  enforce_eager: true
  quantization: null
  max_model_len: 8192
  trust_remote_code: true
  dtype: "bfloat16"
  seed: 1
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

repe_eng_config:
  data_dir: "data/stimulus/crowd-enVent_textlike"

generation_config:
  temperature: 0.0
  max_new_tokens: 5
  do_sample: false
  repetition_penalty: 1.0
  enable_thinking: false

batch_size: 500
output_dir: "results/game_theory_base_model/diplomcacy"
sanity_check: true
defer_evaluation: false
