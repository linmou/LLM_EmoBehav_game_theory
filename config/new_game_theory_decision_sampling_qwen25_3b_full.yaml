experiment_name: "new_game_theory_decision_qwen25_3b_full"
description: "Full game_theory_decision sweep for Qwen2.5-3B-Instruct."
version: "1.0.0"

models:
  - "/home/jjl7137/huggingface_models/Qwen/Qwen2.5-3B-Instruct"

emotions: ["anger", "sadness", "happiness", "surprise", "fear", "disgust"]
intensities: [0.8, 1.0, 1.2]

benchmarks:
  - name: "game_theory_decision"
    task_type: "Prisoners_Dilemma"
    augmentation_config:
      shuffle_options: true
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 300
  - name: "game_theory_decision"
    task_type: "Stag_Hunt"
    augmentation_config:
      shuffle_options: true
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 300
  - name: "game_theory_decision"
    task_type: "Escalation_Game"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 300
  - name: "game_theory_decision"
    task_type: "Trust_Game_Trustor"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 300
  - name: "game_theory_decision"
    task_type: "Trust_Game_Trustee"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 1
      previous_trust_level: 1
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 300
  - name: "game_theory_decision"
    task_type: "Ultimatum_Game_Proposer"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
      previous_offer_level: 1
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 300
  - name: "game_theory_decision"
    task_type: "Ultimatum_Game_Responder"
    augmentation_config:
      shuffle_options: true
    enable_auto_truncation: false
    truncation_strategy: "right"
    preserve_ratio: 1.0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 300

loading_config:
  gpu_memory_utilization: 0.68
  enforce_eager: true
  quantization: null
  max_model_len: 8192
  trust_remote_code: true
  dtype: "bfloat16"
  seed: 1
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

repeat_runs: 3

generation_config:
  temperature: 0.7
  max_new_tokens: 500
  do_sample: true
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 300

repe_eng_config:
  data_dir: "data/stimulus/crowd-enVent_textlike"
  control_layers:
    strategy: "middle_third"

output_dir: "results/new_game_theory_decision/sampling_qwen25_3b_full_300"
sanity_check: false
defer_evaluation: false
