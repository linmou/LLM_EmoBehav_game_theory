description: "Run PD-style Diplomacy gradient benchmark via registry"
version: "0.1.0"

models:
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen2.5-0.5B-Instruct"  
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen2.5-1.5B-Instruct"  
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen2.5-3B-Instruct" 

benchmarks:
  - name: "diplomacy_pd"
    task_type: "v1"
    base_data_dir: "data/diplomacy"
    enable_auto_truncation: false
    truncation_strategy: "right"
    preserve_ratio: 1.0

emotions: ["anger", "sadness", "happiness", "fear", "disgust", "surprise"]
intensities: [1.5]

loading_config:
  model_path: null
  gpu_memory_utilization: 0.90
  tensor_parallel_size: null
  max_model_len: 32768
  enforce_eager: true
  quantization: null
  trust_remote_code: true
  dtype: "float16"
  seed: 42
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

generation_config:
  temperature: 0.1
  max_new_tokens: 64
  do_sample: false
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 16
max_evaluation_workers: 2
pipeline_queue_size: 2

output_dir: "results/diplomacy_pd_sanity_check"

