experiment_name: "beauty_contest_dryrun"
description: "Dry run to validate Beauty Contest dataset parsing"
version: "0.1.0"

models:
  - "gpt2"

emotions: ["anger"]
intensities: [1.0]

benchmarks:
  - name: "game_theory"
    task_type: "Beauty_Contest"
    data_path: "data_creation/scenario_creation/langgraph_creation/Beauty_Contest_all_data_samples.json"
    augmentation_config: null
    enable_auto_truncation: false
    truncation_strategy: "right"
    preserve_ratio: 1.0
    llm_eval_config: null

loading_config:
  gpu_memory_utilization: 0.1
  enforce_eager: true
  max_model_len: 2048
  trust_remote_code: true
  dtype: "float16"
  seed: 1
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

generation_config:
  temperature: 0.1
  max_new_tokens: 32
  do_sample: false
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 2
defer_evaluation: true
output_dir: "results/beauty_contest_dryrun"
