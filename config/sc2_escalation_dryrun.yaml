experiment_name: "sc2_escalation_dryrun"
description: "Dry run for SC2 escalation benchmark via emotion_experiment_engine"
version: "0.1.0"

models:
  - "${USER_HOME}/huggingface_models/Qwen/Qwen2.5-0.5B-Instruct"
  - "${USER_HOME}/huggingface_models/Qwen/Qwen2.5-1.5B-Instruct"
  - "${USER_HOME}/huggingface_models/Qwen/Qwen2.5-3B-Instruct"

emotions: ["anger", "happiness", "sadness", "surprise", "fear", "disgust"]
intensities: [1.0, 1.5, 2.0]

benchmarks:
  - name: "sc2_escalation"
    task_type: "Escalation_Game"
    # SC2EscalationDataset resolves data/sc2/escalation_game.json internally
    data_path: "data/sc2/escalation_game_expanded.json" 
    augmentation_config: null
    enable_auto_truncation: false
    truncation_strategy: "right"
    preserve_ratio: 1.0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0


repeat_runs: 5
repeat_seed_base: 1231

loading_config:
  gpu_memory_utilization: 0.9
  enforce_eager: true
  quantization: null
  trust_remote_code: true
  dtype: "float16"
  seed: 1
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

repeat_runs: 1

generation_config:
  temperature: 0.8
  max_new_tokens: 398
  do_sample: true
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 500
defer_evaluation: true
output_dir: "results/sc2_escalation"
