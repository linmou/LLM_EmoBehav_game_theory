experiment_name: "vlm_mm_game_theory_sanity"
description: "Sanity check: run all downloaded VLMs on a tiny multimodal PD dataset"
version: "1.0.0"

models:
  - "/home/jjl7137/huggingface_models/microsoft/Phi-4-multimodal-instruct"
  - "/home/jjl7137/huggingface_models/microsoft/Phi-3.5-vision-instruct"
  - "/home/jjl7137/huggingface_models/Qwen/Qwen3-VL-2B-Instruct"
  - "/home/jjl7137/huggingface_models/Qwen/Qwen3-VL-4B-Instruct"
  - "/home/jjl7137/huggingface_models/Qwen/Qwen3-VL-4B-Thinking"
  - "/home/jjl7137/huggingface_models/OpenGVLab/InternVL3-1B"
  - "/home/jjl7137/huggingface_models/OpenGVLab/InternVL3-2B"
  - "/home/jjl7137/huggingface_models/OpenGVLab/InternVL3-8B-AWQ"

emotions: ["anger"]
intensities: [1.0]

benchmarks:
  - name: "game_theory_mm"
    task_type: "Prisoners_Dilemma"
    data_path: "data/pseudo/game_theory_mm/pseudo_prisoners_dilemma_mm_color.json"
    augmentation_config:
      shuffle_options: false
      previous_actions_length: 0

loading_config:
  gpu_memory_utilization: 0.9
  max_model_len: 8192
  enforce_eager: true
  quantization: null
  trust_remote_code: true
  dtype: "float16"
  seed: 1
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

repe_eng_config:
  data_dir: "multimodal_crow_envnt/emotion_envent"
  multimodal_intent: true

repeat_runs: 1

generation_config:
  temperature: 0.0
  max_new_tokens: 64
  do_sample: false
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 2

max_evaluation_workers: 1
pipeline_queue_size: 2

output_dir: "results/vlm_mm_game_theory/sanity"
sanity_check: true
sanity_check_limit: 2
defer_evaluation: true
