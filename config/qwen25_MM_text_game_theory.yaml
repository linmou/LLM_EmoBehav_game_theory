experiment_name: "qwen25_mm_text_game_theory"
description: "Run Qwen2.5-VL with text-only stimulus for game theory benchmark"
version: "1.0.0"

models:
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen2.5-VL-3B-Instruct"

emotions: ["anger", "sadness", "happiness", "surprise", "fear", "disgust"]
intensities: [1.0, 1.5, 2.0]

benchmarks:
  - name: "game_theory_decision"
    task_type: "Trust_Game_Trustor"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
  - name: "game_theory_decision"
    task_type: "Trust_Game_Trustee"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 1
      previous_trust_level: 1
    enable_auto_truncation: false
    truncation_strategy: "right"
    preserve_ratio: 1.0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
  - name: "game_theory_decision"
    task_type: "Ultimatum_Game_Proposer"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
      previous_offer_level: 1
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
  - name: "game_theory_decision"
    task_type: "Ultimatum_Game_Responder"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 1
      previous_offer_level: 2
    enable_auto_truncation: false
    truncation_strategy: "right"
    preserve_ratio: 1.0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0

loading_config:
  gpu_memory_utilization: 0.9
  enforce_eager: true
  quantization: null
  trust_remote_code: true
  dtype: "float16"
  seed: 1
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

repe_eng_config:
  multimodal_intent: false  # force text-only stimulus on multimodal model
  rebuild: false

repeat_runs: 1

generation_config:
  temperature: 0.1
  max_new_tokens: 1000
  do_sample: false
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 500

output_dir: "results/qwen25_mm_text_game_theory"
sanity_check: true
defer_evaluation: true
