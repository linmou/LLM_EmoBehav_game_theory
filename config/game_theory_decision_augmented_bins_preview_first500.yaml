experiment_name: "game_theory_decision_augmented_bins_preview_first500"
description: "Game theory decision benchmark using augmented-bins preview datasets (first 500 samples each)."
version: "1.0.0"

models:
  - "${USER_HOME}/huggingface_models/google/gemma-3-270m-it"
  - "${USER_HOME}/huggingface_models/google/gemma-3-1b-it"
  - "${USER_HOME}/huggingface_models/google/gemma-3-4b-it"
  - "${USER_HOME}/huggingface_models/microsoft/Phi-3.5-mini-instruct/"
  - "${USER_HOME}/huggingface_models/microsoft/Phi-4-mini-instruct/"
  - "${USER_HOME}/huggingface_models/meta-llama/Llama-3.2-1B-Instruct"
  - "${USER_HOME}/huggingface_models/meta-llama/Llama-3.2-3B-Instruct"
    #- "${USER_HOME}/huggingface_models/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

emotions: ["anger", "sadness", "happiness", "surprise", "fear", "disgust"]
intensities: [1.5]

benchmarks:
  - name: "game_theory_decision"
    task_type: "Prisoners_Dilemma"
    data_path: "data_creation/scenario_creation/langgraph_creation/augmented_bins_preview/Prisoners_Dilemma_all_data_samples.aug_bins4.gemini-2.5-flash.first500.json"
    augmentation_config:
      shuffle_options: true
      use_augmented_options: true
      augmented_options_field: "augmented_options_v1"
      augmented_options_bins: 4
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0

  - name: "game_theory_decision"
    task_type: "Stag_Hunt"
    data_path: "data_creation/scenario_creation/langgraph_creation/augmented_bins_preview/Stag_Hunt_all_data_samples.aug_bins4.gemini-2.5-flash.first500.json"
    augmentation_config:
      shuffle_options: true
      use_augmented_options: true
      augmented_options_field: "augmented_options_v1"
      augmented_options_bins: 4
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0

  - name: "game_theory_decision"
    task_type: "Escalation_Game"
    data_path: "data_creation/scenario_creation/langgraph_creation/augmented_bins_preview/Escalation_Game_all_data_samples.aug_bins4.gemini-2.5-flash.first500.json"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
      use_augmented_options: true
      augmented_options_field: "augmented_options_v1"
      augmented_options_bins: 4
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0

  - name: "game_theory_decision"
    task_type: "Trust_Game_Trustor"
    data_path: "data_creation/scenario_creation/langgraph_creation/augmented_bins_preview/Trust_Game_Trustor_all_data_samples.aug_bins5.gemini-2.5-flash.first500.json"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
      use_augmented_options: true
      augmented_options_field: "augmented_options_v1"
      augmented_options_bins: 5
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0

  - name: "game_theory_decision"
    task_type: "Trust_Game_Trustee"
    # Note: upstream game_configs uses the Trustor JSON for Trustee too.
    data_path: "data_creation/scenario_creation/langgraph_creation/augmented_bins_preview/Trust_Game_Trustor_all_data_samples.aug_bins5.gemini-2.5-flash.first500.json"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 1
      previous_trust_level: 1
      use_augmented_options: true
      augmented_options_field: "augmented_options_v1"
      augmented_options_bins: 5
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0

  - name: "game_theory_decision"
    task_type: "Ultimatum_Game_Proposer"
    data_path: "data_creation/scenario_creation/langgraph_creation/augmented_bins_preview/Ultimatum_Game_Proposer_all_data_samples.aug_bins5.gemini-2.5-flash.first500.json"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
      previous_offer_level: 1
      use_augmented_options: true
      augmented_options_field: "augmented_options_v1"
      augmented_options_bins: 5
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0

  - name: "game_theory_decision"
    task_type: "Ultimatum_Game_Responder"
    # Note: upstream game_configs uses the Proposer JSON for Responder too.
    data_path: "data_creation/scenario_creation/langgraph_creation/augmented_bins_preview/Ultimatum_Game_Proposer_all_data_samples.aug_bins5.gemini-2.5-flash.first500.json"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 1
      previous_offer_level: 2
      use_augmented_options: true
      augmented_options_field: "augmented_options_v1"
      augmented_options_bins: 5
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0

loading_config:
  gpu_memory_utilization: 0.7
  enforce_eager: true
  quantization: null
  max_model_len: 4096
  trust_remote_code: true
  dtype: "bfloat16"
  seed: 1
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

repeat_runs: 1

generation_config:
  temperature: 0.1
  max_new_tokens: 1000
  do_sample: false
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 200

output_dir: "results/game_theory_decision/augmented_bins_preview_first500"
defer_evaluation: true
sanity_check: false
