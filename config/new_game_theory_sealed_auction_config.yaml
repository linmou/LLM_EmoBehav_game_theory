experiment_name: "sealed_auction_game_theory_dryrun"
description: "Dry-run config for Sealed_Auction via game_theory benchmark"
version: "1.0.0"

models:
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen2.5-0.5B-Instruct"
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen2.5-1.5B-Instruct"
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen2.5-3B-Instruct"
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen3-0.6B"
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen3-1.7B"
  - "/data/home/jjl7137/huggingface_models/Qwen/Qwen3-4B"

emotions: ["anger", "happiness", "sadness", "surprise", "fear", "disgust"]
intensities: [1.5]

benchmarks:
  - name: "game_theory_decision"
    task_type: "Sealed_Auction"
    augmentation_config:
      shuffle_options: true
    enable_auto_truncation: false
    truncation_strategy: "right"
    preserve_ratio: 1.0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0

loading_config:
  gpu_memory_utilization: 0.8
  enforce_eager: true
  quantization: null
  trust_remote_code: true
  dtype: "float16"
  seed: 1
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

repeat_runs: 1

generation_config:
  temperature: 0.1
  max_new_tokens: 256
  do_sample: false
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 600
output_dir: "results/sc2_sealed_auction/decision_only"
defer_evaluation: true
sanity_check: false
