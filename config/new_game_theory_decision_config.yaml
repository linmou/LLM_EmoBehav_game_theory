experiment_name: "game_theory_decision"
description: "Game theory decision-only prompt variant (JSON decision required)"
version: "1.0.0"

models:
  - "/data/home/jjl7137/huggingface_models/google/gemma-3-270m-it"
  - "/data/home/jjl7137/huggingface_models/google/gemma-3-1b-it"
  - "/data/home/jjl7137/huggingface_models/google/gemma-3-4b-it"
  - "/data/home/jjl7137/huggingface_models/microsoft/Phi-3.5-mini-instruct/"
  - "/data/home/jjl7137/huggingface_models/microsoft/Phi-4-mini-instruct/"
  - "/data/home/jjl7137/huggingface_models/meta-llama/Llama-3.2-1B-Instruct"
  - "/data/home/jjl7137/huggingface_models/meta-llama/Llama-3.2-3B-Instruct"
  - "/data/home/jjl7137/huggingface_models/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

emotions: ["anger", "sadness", "happiness", "surprise", "fear", "disgust"]
intensities:
  - 1.5

benchmarks:
  - name: "game_theory_decision"
    task_type: "Prisoners_Dilemma"
    augmentation_config:
      shuffle_options: true
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
  - name: "game_theory_decision"
    task_type: "Stag_Hunt"
    augmentation_config:
      shuffle_options: true
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
  - name: "game_theory_decision"
    task_type: "Escalation_Game"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
  - name: "game_theory_decision"
    task_type: "Trust_Game_Trustor"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
  - name: "game_theory_decision"
    task_type: "Trust_Game_Trustee"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 1
      previous_trust_level: 1
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
  - name: "game_theory_decision"
    task_type: "Ultimatum_Game_Proposer"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 0
      previous_offer_level: 1
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
  - name: "game_theory_decision"
    task_type: "Ultimatum_Game_Responder"
    augmentation_config:
      shuffle_options: true
      previous_actions_length: 1
      previous_offer_level: 2
    enable_auto_truncation: false
    truncation_strategy: "right"
    preserve_ratio: 1.0
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0

loading_config:
  gpu_memory_utilization: 0.88
  enforce_eager: true
  quantization: null
  max_model_len: 4096
  trust_remote_code: true
  dtype: "bfloat16"
  seed: 1
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

repeat_runs: 1

generation_config:
  temperature: 0.1
  max_new_tokens: 1000
  do_sample: false
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 1000

output_dir: "results/new_game_theory_decision/shuffle_choices"
defer_evaluation: true
sanity_check: false
