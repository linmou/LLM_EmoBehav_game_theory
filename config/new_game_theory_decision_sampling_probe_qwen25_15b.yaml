experiment_name: "game_theory_decision_sampling_probe_qwen25_15b"
description: "Sampling and intensity sensitivity probe for Qwen2.5 1.5B on game_theory_decision."
version: "1.0.0"

models:
  - "/home/jjl7137/huggingface_models/Qwen/Qwen2.5-1.5B-Instruct"

emotions: ["anger", "happiness"]
intensities: [0.8, 1.0, 1.2]

benchmarks:
  - name: "game_theory_decision"
    task_type: "Prisoners_Dilemma"
    augmentation_config:
      shuffle_options: true
    llm_eval_config:
      client: "gemini"
      model: "gemini-2.5-flash-lite"
      temperature: 0.0
    sample_limit: 50

loading_config:
  gpu_memory_utilization: 0.72
  enforce_eager: true
  quantization: null
  max_model_len: 8192
  trust_remote_code: true
  dtype: "bfloat16"
  seed: 1
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

repeat_runs: 3

generation_config:
  temperature: 0.7
  max_new_tokens: 500
  do_sample: true
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 16

repe_eng_config:
  data_dir: "data/stimulus/crowd-enVent_textlike"
  control_layers:
    strategy: "last_5"

output_dir: "results/new_game_theory_decision/sampling_probe_qwen25_15b"
sanity_check: false
defer_evaluation: false
