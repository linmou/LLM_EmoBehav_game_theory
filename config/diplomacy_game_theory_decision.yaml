loading_config:
  gpu_memory_utilization: 0.88
  enforce_eager: true
  quantization: null
  max_model_len: 4096
  trust_remote_code: true
  dtype: "float16"
  seed: 1
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

repeat_runs: 1
repeat_seed_base: 1231

generation_config:
  temperature: 0.1
  max_new_tokens: 512
  do_sample: false
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 500

output_dir: "results/new_game_theory_decision/diplomacy_beauty_contest_test"
sanity_check: false
defer_evaluation: false
