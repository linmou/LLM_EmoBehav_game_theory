description: "Diplomacy PD: light sampling (temp=0.4, top_p=0.9) with intensity sweep"
version: "0.1.0"

models:
  - "${USER_HOME}/huggingface_models/Qwen/Qwen2.5-3B-Instruct"

benchmarks:
  - name: "diplomacy_pd"
    task_type: "v1b"
    base_data_dir: "data/diplomacy"
    data_path: "data/diplomacy/diplomacy_pd_escalation_20251117_x10.jsonl"
    enable_auto_truncation: false
    truncation_strategy: "right"
    preserve_ratio: 1.0

emotions: ["anger", "sadness", "happiness", "fear", "disgust", "surprise"]
intensities: [0.5, 1.0, 1.5, 2.0, 2.5]

loading_config:
  model_path: null
  gpu_memory_utilization: 0.90
  tensor_parallel_size: null
  max_model_len: 32768
  enforce_eager: true
  quantization: null
  trust_remote_code: true
  dtype: "float16"
  seed: 42
  disable_custom_all_reduce: false
  additional_vllm_kwargs: {}

generation_config:
  temperature: 0.4
  max_new_tokens: 64
  do_sample: true
  top_p: 0.9
  repetition_penalty: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  enable_thinking: false

batch_size: 18
max_evaluation_workers: 2
pipeline_queue_size: 2

output_dir: "results.bk/auto_experiments/diplomacy_emotion_effects_sampled"
